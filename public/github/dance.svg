<svg xmlns="http://www.w3.org/2000/svg" width="260" height="180" viewBox="0 0 260 180" role="img" aria-label="Moonwalking dancer">
  <defs>
    <style>
      /* slide across the stage */
      @keyframes walk { 0%{transform:translateX(-44px)} 50%{transform:translateX(44px)} 100%{transform:translateX(-44px)} }
      /* the anti-gravity lean, synced to the slide */
      @keyframes lean { 0%{transform:rotate(7deg)} 25%{transform:rotate(0)} 50%{transform:rotate(-7deg)} 75%{transform:rotate(0)} 100%{transform:rotate(7deg)} }
      /* moonwalk leg shuffle */
      @keyframes shL { 0%,100%{transform:rotate(15deg)} 50%{transform:rotate(-13deg)} }
      @keyframes shR { 0%,100%{transform:rotate(-13deg)} 50%{transform:rotate(15deg)} }
      /* the raised glove hand pumps a little */
      @keyframes glove { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-3px,-4px)} }
      @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

      #stage { animation: walk 6s ease-in-out infinite; }
      #bob   { animation: bob .75s ease-in-out infinite; }
      #lean  { transform-origin:110px 166px; animation: lean 6s ease-in-out infinite; }
      #legL  { transform-origin:104px 116px; animation: shL .5s ease-in-out infinite; }
      #legR  { transform-origin:116px 116px; animation: shR .5s ease-in-out infinite; }
      #arm   { transform-origin:132px 76px; animation: glove .5s ease-in-out infinite; }
    </style>
  </defs>

  <g id="stage">
    <ellipse cx="110" cy="172" rx="40" ry="6" fill="#000" fill-opacity="0.22"/>
    <g id="bob">
      <g id="lean">
        <!-- legs (behind torso) -->
        <g id="legL">
          <rect x="99" y="114" width="10" height="36" rx="3" fill="#0b0b12"/>
          <rect x="99" y="150" width="10" height="8" fill="#fff"/>
          <ellipse cx="101" cy="160" rx="10" ry="5" fill="#15151f"/>
        </g>
        <g id="legR">
          <rect x="111" y="114" width="10" height="36" rx="3" fill="#0b0b12"/>
          <rect x="111" y="150" width="10" height="8" fill="#fff"/>
          <ellipse cx="119" cy="160" rx="10" ry="5" fill="#15151f"/>
        </g>

        <!-- left arm (down at side) -->
        <path d="M90 76 L82 78 L75 110 L83 112 Z" fill="#0b0b12"/>
        <circle cx="79" cy="112" r="5" fill="#d9a679"/>

        <!-- torso: black jacket + white shirt -->
        <path d="M88 74 L132 74 L126 118 L94 118 Z" fill="#0b0b12"/>
        <path d="M110 74 L103 104 L117 104 Z" fill="#fff"/>
        <rect x="107" y="76" width="6" height="26" fill="#15151f"/>
        <!-- collar -->
        <path d="M104 74 L110 82 L116 74 Z" fill="#fff"/>

        <!-- right arm raised with white glove -->
        <g id="arm">
          <path d="M130 74 L138 72 L156 48 L147 44 Z" fill="#0b0b12"/>
          <circle cx="152" cy="45" r="7.5" fill="#fff" stroke="#d8d8e0" stroke-width="1"/>
        </g>

        <!-- neck + head -->
        <rect x="105" y="64" width="10" height="9" fill="#d9a679"/>
        <circle cx="110" cy="57" r="11" fill="#d9a679"/>
        <path d="M99 55 Q100 43 110 43 Q120 43 121 55 Q116 50 110 50 Q104 50 99 55 Z" fill="#1a1208"/>

        <!-- fedora, tilted -->
        <g transform="rotate(-13 110 40)">
          <ellipse cx="110" cy="42" rx="31" ry="7" fill="#0d0d12"/>
          <path d="M89 42 Q91 21 110 21 Q129 21 131 42 Z" fill="#0d0d12"/>
          <rect x="90" y="36" width="40" height="5" fill="#2b2b3a"/>
        </g>
      </g>
    </g>
  </g>
</svg>
